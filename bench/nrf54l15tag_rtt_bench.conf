#
# Bench-only RTT logging fragment for the nRF54L15 TAG reflector used in the
# LM20/TAG interop campaign (#36-#39). It is NOT part of the sibling
# repository's nrf54l15tag_peri_a2_4_ipt preset and never ships.
#
# The stock nrf54l15tag.conf console is the SEGGER terminal up-buffer 0: 1 KiB
# in NO_BLOCK_SKIP mode, and the app runs CONFIG_LOG_MODE_MINIMAL, so log
# output goes straight to the RTT console and is silently dropped once the
# ring fills. A post-run read after a 600 s soak would therefore show only the
# first kilobyte, or a stale ring.
#
# This fragment keeps the most recent output instead:
#   - deferred log mode with the RTT backend (minimal mode ignores the backend
#     settings entirely);
#   - overwrite mode: SEGGER_RTT_WriteWithOverwriteNoLock() wraps buffer 0, so
#     the tail of the run survives no matter how many lines are logged;
#   - a 32 KiB up-buffer: ~3 minutes of the reflector's normal line rate, and
#     the full boot/config block even after a long soak.
# LOG_BACKEND_RTT_FORCE_PRINTK defaults to y for buffer 0 + RTT_CONSOLE, so
# printk() shares the same overwrite ring rather than corrupting it.
#
# Apply it AFTER boards/nrf54l15tag.conf in EXTRA_CONF_FILE. The image's
# _SEGGER_RTT control block must be invalidated (or the TAG power-cycled)
# before a clean boot, or STRONG_CHECK reuses the stale control block.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=32768
