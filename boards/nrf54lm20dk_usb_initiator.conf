#
# Native USB transport for the initiator: the COBS ranging stream and the
# console move from the onboard debugger's virtual COM ports to the nRF54LM20
# USBHS controller. Applied only by the nrf54lm20dk_usb_* initiator presets;
# the VCOM presets never see this fragment.
#

CONFIG_MARS_CS_TRANSPORT_USB=y
CONFIG_MARS_CS_ROLE_INITIATOR=y

# CONFIG_MARS_CS_TRANSPORT_USB selects the device-next USB stack, the CDC ACM
# class, and HWINFO (for the serial-number descriptor). High speed is the
# required link; full speed remains a supported fallback.
CONFIG_USBD_MAX_SPEED_HIGH=y

# The data function's transmit ring is 32 KiB (one worst-case run plus
# headroom); the default 32,767-byte ring-buffer limit would reject it.
CONFIG_RING_BUFFER_LARGE=y

# NCSDK-38624: CDC ACM serial initialization at boot can hang the nRF54LM20
# until the USB cable is disconnected. The shared USB module enables the UDC
# on VBUS attach instead, so this helper must stay off.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Run the CDC ACM class work on its own thread. The COBS backend's TX-drain
# callback (which gives the transmit gate) is invoked from that work, and the
# CS liveness watchdog's recovery work runs on the system workqueue and takes
# the gate before forcing its disconnect. On the shared system workqueue the
# callback could not run while the recovery work waits for it, so the banner's
# acquire would time out whenever a ranging run was mid-drain (#57).
#
# The dedicated queue inherits CONFIG_SYSTEM_WORKQUEUE_PRIORITY (-1); its
# handlers are shallow (the COBS drain callback adds only ring-buffer and
# uart_fifo_fill frames), so the upstream 1024-byte
# CONFIG_USBD_CDC_ACM_STACK_SIZE is adequate and neither needs an override.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y

# Deferred console logging: producers only enqueue, so a host that does not
# read the console cannot stall the firmware. The bounded log queue drops
# under pressure (never blocks).
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=4096

# Per-transfer USB logging at informational level measurably caps the data
# port throughput on this stack; keep the USB stack quiet on the console.
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# The USB backend uses the CDC ACM interrupt-driven UART API, not the
# asynchronous API the VCOM backend needs.
CONFIG_UART_ASYNC_API=n
