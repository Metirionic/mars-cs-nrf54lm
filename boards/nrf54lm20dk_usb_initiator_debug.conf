#
# NON-RELEASE debug console variant for the native USB initiator.
#
# Apply after boards/nrf54lm20dk_usb_initiator.conf, together with
# boards/nrf54lm20dk_nrf54lm20a_cpuapp_usb_initiator_debug.overlay. The COBS
# ranging stream stays on the native USB data function; only the log console
# moves to the J-Link VCOM1 (uart20), keeping pre-enumeration and hard-fault
# output visible during bring-up.
#
# Not part of the release preset matrix: no CMake preset applies this
# fragment, so CI and the release archive neither build nor ship it.
#

CONFIG_MARS_CS_USB_DEBUG_CONSOLE_VCOM=y
